name: Listing preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "teams/**"
      - "bots/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: listing-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add or update listing preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const listings = files.filter(({ filename, status }) =>
              status === "added" && /^(teams|bots)\/[^/]+\.md$/.test(filename),
            );
            if (!listings.length) {
              core.info("No new listing files.");
              return;
            }
            const lines = listings.map(({ filename }) => {
              const [kind, name] = filename.split("/");
              const slug = name.replace(/\.md$/, "");
              return `- \`${filename}\` -> https://botteams.io/${kind}/${slug}`;
            });
            const body = [
              "<!-- listing-preview -->",
              "After this pull request is approved, passes every check, and is merged, these listings go live on production:",
              "",
              ...lines,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              (comment.body || "").includes("<!-- listing-preview -->"),
            );
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              });
            }
