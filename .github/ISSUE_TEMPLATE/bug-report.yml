name: Bug report
description: Report a reproducible problem with the website, API, or repository tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: Page, endpoint, or command
      placeholder: https://botteams.io/teams/founder-os or npm run validate
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use the smallest safe example. Remove credentials and private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, or Node version when relevant.
